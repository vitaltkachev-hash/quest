<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0D0D0D; }
      .struct-main { stroke: #FFFFFF; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .struct-inner { stroke: #888888; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 6 6; fill: none; }
      .struct-face { fill: #FFFFFF; fill-opacity: 0.05; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="500" height="500" rx="32" />

  <!-- Monogram & 3D Structure Icon -->
  <g transform="translate(0, 10)">
    <!-- Polygons for depth -->
    <polygon class="struct-face" points="250,110 360,170 250,230 140,170" />
    <polygon class="struct-face" points="140,170 250,230 250,350 140,290" />
    <polygon class="struct-face" points="250,230 360,170 360,290 250,350" />

    <!-- Outer Contour -->
    <polygon class="struct-main" points="250,110 360,170 360,290 250,350 140,290 140,170" />

    <!-- Internal Lines -->
    <line class="struct-main" x1="250" y1="230" x2="250" y2="350" />
    <line class="struct-main" x1="250" y1="230" x2="140" y2="170" />
    <line class="struct-main" x1="250" y1="230" x2="360" y2="170" />

    <!-- Accent Lines -->
    <line class="struct-inner" x1="140" y1="170" x2="250" y2="110" />
    <line class="struct-inner" x1="360" y1="170" x2="250" y2="110" />
    <line class="struct-inner" x1="140" y1="290" x2="250" y2="230" />
    <line class="struct-inner" x1="360" y1="290" x2="250" y2="230" />
  </g>
</svg>
