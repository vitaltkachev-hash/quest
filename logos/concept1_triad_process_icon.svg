<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0D0D0D; }
      .line { stroke: #FFFFFF; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .line-accent { stroke: #CCCCCC; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="500" height="500" rx="32" />

  <!-- Monogram T Icon: Triad Process -->
  <g transform="translate(0, 5)">
    <!-- Line 1: Horizontal top bar (THINK) -->
    <path class="line" d="M 130 170 L 370 170" />

    <!-- Line 2: Vertical stem (CREATE) -->
    <path class="line-accent" d="M 250 170 L 250 360" />

    <!-- Line 3: Intersecting diagonal (REALIZE) -->
    <path class="line" d="M 170 360 L 330 200" />
  </g>
</svg>
