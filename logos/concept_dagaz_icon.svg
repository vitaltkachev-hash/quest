<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0F141C; }
      .dagaz-outer { stroke: #FFFFFF; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .dagaz-core { stroke: #D47A47; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .dagaz-fill { fill: #D47A47; fill-opacity: 0.15; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="500" height="500" rx="32" />

  <!-- Dagaz Icon -->
  <g transform="translate(0, 5)">
    <polygon class="dagaz-fill" points="140,130 250,230 140,330" />
    <polygon class="dagaz-fill" points="360,130 250,230 360,330" />

    <line class="dagaz-outer" x1="140" y1="130" x2="140" y2="330" />
    <line class="dagaz-outer" x1="360" y1="130" x2="360" y2="330" />

    <line class="dagaz-core" x1="140" y1="130" x2="360" y2="330" />
    <line class="dagaz-core" x1="140" y1="330" x2="360" y2="130" />

    <circle cx="250" cy="230" r="6" fill="#D47A47" />
  </g>
</svg>
