<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0E14; }
      .dagaz-line { stroke: #D47A47; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .dagaz-fill { fill: #D47A47; fill-opacity: 0.15; }
      .brand-title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #D47A47; letter-spacing: 0.35em; text-anchor: middle; }
      .brand-subtitle { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #E5A882; letter-spacing: 0.45em; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="500" height="500" rx="32" />

  <!-- Dagaz Rune Copper Theme -->
  <g transform="translate(0, -10)">
    <polygon class="dagaz-fill" points="150,140 250,220 150,300" />
    <polygon class="dagaz-fill" points="350,140 250,220 350,300" />

    <line class="dagaz-line" x1="150" y1="140" x2="150" y2="300" />
    <line class="dagaz-line" x1="350" y1="140" x2="350" y2="300" />

    <line class="dagaz-line" x1="150" y1="140" x2="350" y2="300" />
    <line class="dagaz-line" x1="150" y1="300" x2="350" y2="140" />

    <circle cx="250" cy="220" r="5" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="250" y="405" class="brand-title">TKACHEV</text>
  <text x="250" y="430" class="brand-subtitle">STUDIO</text>
</svg>
