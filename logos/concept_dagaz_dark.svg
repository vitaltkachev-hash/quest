<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0F141C; }
      .dagaz-outer { stroke: #FFFFFF; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .dagaz-core { stroke: #D47A47; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .dagaz-fill { fill: #D47A47; fill-opacity: 0.12; }
      .brand-title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.35em; text-anchor: middle; }
      .brand-subtitle { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #8A99AD; letter-spacing: 0.45em; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background: Deep Graphite / Dark Blue -->
  <rect class="bg" width="500" height="500" rx="32" />

  <!-- Dagaz Rune / Transformation Monogram -->
  <!-- Geometry: Left Vertical (150,140 to 150,300), Right Vertical (350,140 to 350,300), Diagonal X (150,140 to 350,300 & 150,300 to 350,140) -->
  <g transform="translate(0, -10)">
    <!-- Subtly shaded central transformation triangles -->
    <polygon class="dagaz-fill" points="150,140 250,220 150,300" />
    <polygon class="dagaz-fill" points="350,140 250,220 350,300" />

    <!-- Outer Structural Frame -->
    <line class="dagaz-outer" x1="150" y1="140" x2="150" y2="300" />
    <line class="dagaz-outer" x1="350" y1="140" x2="350" y2="300" />

    <!-- Central Transformation X (Industrial Copper) -->
    <line class="dagaz-core" x1="150" y1="140" x2="350" y2="300" />
    <line class="dagaz-core" x1="150" y1="300" x2="350" y2="140" />

    <!-- Center Point of Transformation Indicator -->
    <circle cx="250" cy="220" r="4" fill="#D47A47" />
  </g>

  <!-- Typography -->
  <text x="250" y="405" class="brand-title">TKACHEV</text>
  <text x="250" y="430" class="brand-subtitle">STUDIO</text>
</svg>
